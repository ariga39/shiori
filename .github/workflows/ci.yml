name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Synthetic service credentials only; no repository or user credential
      # is used by CI.  The test DSN itself omits the password and psycopg2
      # receives it through this job-local environment variable.
      PGPASSWORD: shiori-ci-only
    services:
      postgres:
        image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_USER: shiori_ci
          POSTGRES_PASSWORD: shiori-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiori_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: '0.12.3'

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Check changelog fragment
        if: github.event_name == 'pull_request'
        run: uv run python tools/changelog_check.py --dir . --base "${{ github.event.pull_request.base.sha }}"

      - name: Verify lockfile and dependency vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv export --locked --all-groups --no-emit-project --format requirements-txt \
            > "${RUNNER_TEMP}/shiori-requirements.txt"
          uv run pip-audit --requirement "${RUNNER_TEMP}/shiori-requirements.txt" \
            --strict --progress-spinner off

      - name: Check direct dependency licenses
        run: uv run python tools/check_licenses.py

      - name: Compile project Python surface
        run: >-
          uv run python -m compileall -q shiori ingest.py ingest_hermes.py
          ingest_discord.py query.py mcp_server.py tests tools

      - name: Lint project
        run: uv run ruff check .

      - name: Check documentation site and LLM index
        run: uv run python tools/docs_check.py --site-dir "${RUNNER_TEMP}/shiori-docs-site"

      - name: Type-check installable package
        run: uv run pyright

      - name: Install pinned PostgreSQL 17 client (PGDG)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates lsb-release gnupg curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          source /etc/os-release
          sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null <<PGDG
          deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main
          PGDG
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          # The runner's default postgresql-client (e.g. 16.14 from Ubuntu)
          # shadows the PGDG 17 binaries via /usr/bin; force 17 on PATH for
          # this step's checks and for all later steps, then verify.
          export PATH="/usr/lib/postgresql/17/bin:${PATH}"
          echo "/usr/lib/postgresql/17/bin" >> "${GITHUB_PATH}"
          pg_dump --version | grep -q ' 17\.'
          pg_restore --version | grep -q ' 17\.'

      - name: Verify pg_dump/pg_restore client matches server major version
        shell: bash
        run: |
          set -euo pipefail
          for tool in pg_dump pg_restore; do
            client_major="$("${tool}" --version | sed -E 's/.* ([0-9]+)\..*/\1/')"
            server_major="$(
              psql --host 127.0.0.1 --port 5432 --username shiori_ci --dbname postgres \
                --set ON_ERROR_STOP=1 --tuples-only --no-align \
                --command 'SHOW server_version_num;' | cut -c1-2
            )"
            if [[ "${client_major}" != "${server_major}" ]]; then
              echo "${tool} client major ${client_major} != server major ${server_major}" >&2
              exit 1
            fi
          done

      - name: Enable pgvector preload and verify service parity
        shell: bash
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 5432 --username shiori_ci --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "ALTER SYSTEM SET shared_preload_libraries = 'vector';"

          expected_image="pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38"
          service_container="${{ job.services.postgres.id }}"
          if [[ ! "${service_container}" =~ ^[0-9a-f]{12,64}$ ]]; then
            echo "GitHub Actions did not provide a valid postgres service container id" >&2
            exit 1
          fi
          tools/verify_pgvector_image.sh "${expected_image}" "${service_container}" >/dev/null
          docker restart "${service_container}" >/dev/null

          ready=false
          for _ in {1..60}; do
            if pg_isready --host 127.0.0.1 --port 5432 --username shiori_ci --dbname postgres >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            echo "pgvector service did not become ready after restart" >&2
            exit 1
          fi

          loaded="$(
            psql --host 127.0.0.1 --port 5432 --username shiori_ci --dbname postgres \
              --set ON_ERROR_STOP=1 --tuples-only --no-align \
              --command 'SHOW shared_preload_libraries;'
          )"
          if ! grep -Eq '(^|[,[:space:]])vector([,[:space:]]|$)' <<<"${loaded}"; then
            echo "pgvector preload verification failed" >&2
            exit 1
          fi

      - name: Prepare isolated database
        shell: bash
        run: |
          set -euo pipefail
          db="shiori_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RANDOM}"
          marker="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          if [[ ! "${marker}" =~ ^ci-[0-9]+-[0-9]+-[0-9]+$ ]]; then
            echo "refusing malformed test database marker" >&2
            exit 1
          fi
          psql --host 127.0.0.1 --port 5432 --username shiori_ci --dbname postgres \
            --set ON_ERROR_STOP=1 --command "CREATE DATABASE \"${db}\";"
          dsn="postgresql://shiori_ci@127.0.0.1:5432/${db}"
          psql "${dsn}" --set ON_ERROR_STOP=1 \
            --command "CREATE TABLE shiori_test_guard (marker text PRIMARY KEY); INSERT INTO shiori_test_guard(marker) VALUES ('${marker}');"
          {
            echo "SHIORI_DATABASE_DSN=${dsn}"
            echo "SHIORI_TEST_DATABASE_DSN=${dsn}"
            echo "SHIORI_TEST_DATABASE_NAME=${db}"
            echo "SHIORI_TEST_DATABASE_MARKER=${marker}"
          } >> "${GITHUB_ENV}"

      - name: Apply migrations and verify repository health
        run: |
          uv run shiori db migrate
          uv run shiori db health

      - name: Verify legacy bootstrap upgrade
        shell: bash
        run: |
          set -euo pipefail
          cli="$(uv run python -c 'import shutil; print(shutil.which("shiori") or "")')"
          tools/legacy_schema_upgrade_smoke.sh \
            --cli "${cli}" \
            --admin-dsn "postgresql://shiori_ci@127.0.0.1:5432/postgres"

      - name: Run tests
        run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Clean wheel install and quickstart lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "${smoke_dir}"' EXIT
          uv venv --python 3.12 "${smoke_dir}/venv"
          uv pip install --python "${smoke_dir}/venv/bin/python" dist/*.whl
          cli="${smoke_dir}/venv/bin/shiori"
          "${cli}" --help >/dev/null
          SHIORI_TEST_DATABASE_MARKER="${SHIORI_TEST_DATABASE_MARKER}" \
            tools/clean_machine_smoke.sh \
              --cli "${cli}" \
              --python "${smoke_dir}/venv/bin/python" \
              --dsn "${SHIORI_TEST_DATABASE_DSN}" \
              --database-name "${SHIORI_TEST_DATABASE_NAME}" \
              --workdir "${smoke_dir}/wheel"
          uv pip install --reinstall --python "${smoke_dir}/venv/bin/python" dist/*.tar.gz
          "${cli}" --help >/dev/null

      - name: Fixture-backed full E2E replay smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "${smoke_dir}"' EXIT
          uv venv --python 3.12 "${smoke_dir}/e2e-venv"
          uv pip install --python "${smoke_dir}/e2e-venv/bin/python" dist/*.whl
          SHIORI_TEST_DATABASE_MARKER="${SHIORI_TEST_DATABASE_MARKER}" \
            tools/e2e_replay_smoke.sh \
              --cli "${smoke_dir}/e2e-venv/bin/shiori" \
              --python "${smoke_dir}/e2e-venv/bin/python" \
              --dsn "${SHIORI_TEST_DATABASE_DSN}" \
              --database-name "${SHIORI_TEST_DATABASE_NAME}" \
              --workdir "${smoke_dir}/e2e" \
              --fixture-dir tests/fixtures/replay

      - name: Audit reachable history and public build artifacts
        shell: bash
        run: uv run python tools/release_audit.py --root . --artifact-dir dist

      - name: Prepare redacted failure evidence
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/shiori-failure-evidence"
          mkdir -p "${evidence_dir}"
          cat > "${evidence_dir}/summary.json" <<'JSON'
          {"status":"failed","raw_logs_uploaded":false,"secret_matches":"counts_only","retention_days":1}
          JSON

      - name: Upload redacted failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shiori-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shiori-failure-evidence
          if-no-files-found: error
          retention-days: 1

      - name: Drop isolated database
        if: always()
        shell: bash
        run: tools/drop_isolated_db.sh

  container_scan:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTGRES_DB: shiori_container_ci
      POSTGRES_USER: shiori_container
      POSTGRES_PASSWORD: shiori-ci-only
      SHIORI_PG_PORT: 55432
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Build compose image and record immutable identity
        shell: bash
        run: |
          set -euo pipefail
          project="shiori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "SHIORI_CONTAINER_PROJECT=${project}" >> "${GITHUB_ENV}"
          docker compose --file deploy/docker-compose.yml \
            --project-name "${project}" build --pull session-memory-pg
          image_id="$(docker image inspect shiori-pgvector:local --format '{{.Id}}')"
          if [[ ! "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "compose build did not produce an immutable image id" >&2
            exit 1
          fi
          echo "SHIORI_BUILT_IMAGE_ID=${image_id}" >> "${GITHUB_ENV}"

      - name: Run actual compose runtime smoke
        shell: bash
        run: tools/container_runtime_smoke.sh --project "${SHIORI_CONTAINER_PROJECT}" --skip-build

      - name: Assert scan input is the built compose image
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect shiori-pgvector:local --format '{{.Id}}')"
          [[ "${image_id}" == "${SHIORI_BUILT_IMAGE_ID}" ]] || {
            echo "scan input image changed after runtime smoke" >&2
            exit 1
          }

      - name: Scan built compose image for high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shiori-pgvector:local
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Verify scanned image identity and clean compose resources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          image_id=""
          if image_id="$(docker image inspect shiori-pgvector:local --format '{{.Id}}' 2>/dev/null)"; then
            if [[ -n "${SHIORI_BUILT_IMAGE_ID:-}" && "${image_id}" != "${SHIORI_BUILT_IMAGE_ID}" ]]; then
              echo "scanned image identity changed" >&2
              exit 1
            fi
          fi
          project="shiori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker compose --file deploy/docker-compose.yml \
            --project-name "${project}" down --volumes --remove-orphans
